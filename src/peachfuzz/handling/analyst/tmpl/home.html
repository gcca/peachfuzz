<!doctype html>
<html lang="es" data-theme="cmyk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="htmx-config" content='{"historyRestoreAsHxRequest":false,"reportValidityOfForms":true}' />
    <title>{{app_name}}</title>
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'cmyk');
    </script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'JetBrains Mono', monospace; font-weight: 300; }
      #sidebar { width: 16rem; transition: width 0.2s ease-out; }
      #sidebar-resizer { display: none; }
      .sidebar-collapsed-only { display: none; }
      #sidebar-drawer:checked ~ .drawer-side .sidebar-expand-icon,
      #sidebar-drawer:not(:checked) ~ .drawer-side .sidebar-collapse-icon { display: none; }
      body.sidebar-resizing { cursor: col-resize; user-select: none; }
      body.sidebar-resizing #sidebar-resizer > div { opacity: 0.5; }
      body.htmx-busy, body.htmx-busy * { cursor: progress !important; }
      body.htmx-busy :is(#main-content, #sidebar-nav) a[href] { pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #sidebar { transition: none; }
      }
      @media (min-width: 64rem) {
        #sidebar-drawer:checked ~ .drawer-side #sidebar { width: var(--sidebar-width, 16rem); }
        #sidebar-resizer { display: block; }
        #sidebar-drawer:not(:checked) ~ .drawer-side { overflow: visible; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar { width: 4rem; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar-resizer { display: none; }
        #sidebar-drawer:not(:checked) ~ .drawer-side .sidebar-expanded-only,
        #sidebar-drawer:not(:checked) ~ .drawer-side .sidebar-page-node { display: none; }
        #sidebar-drawer:not(:checked) ~ .drawer-side .sidebar-collapsed-only { display: block; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar-header { justify-content: center; padding-inline: 0.5rem; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar-nav { overflow: visible; padding: 0.5rem; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar-nav > .menu > li > :is(a, button) { justify-content: center; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar-footer { padding: 0.5rem; }
        #sidebar-drawer:not(:checked) ~ .drawer-side #sidebar-user-trigger { justify-content: center; }
      }
    </style>
    <script>
      function setTheme(name) {
        document.documentElement.setAttribute('data-theme', name);
        localStorage.setItem('theme', name);
        document.querySelectorAll('[data-theme-btn]').forEach(function(btn) {
          btn.querySelector('svg').classList.toggle('invisible', btn.dataset.themeBtn !== name);
        });
      }

      function initSidebarResize() {
        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('sidebar-resizer');
        const minWidth = 224;
        const maxWidth = 512;
        const defaultWidth = 256;
        let pointerId = null;
        let startX = 0;
        let startWidth = 0;

        function setWidth(width, persist) {
          const nextWidth = Math.min(maxWidth, Math.max(minWidth, Math.round(width)));
          document.documentElement.style.setProperty('--sidebar-width', nextWidth + 'px');
          resizer.setAttribute('aria-valuenow', String(nextWidth));
          if (persist) localStorage.setItem('sidebar-width', String(nextWidth));
        }

        const savedWidth = Number(localStorage.getItem('sidebar-width'));
        setWidth(Number.isFinite(savedWidth) && savedWidth > 0 ? savedWidth : defaultWidth, false);

        resizer.addEventListener('pointerdown', function(event) {
          if (event.button !== 0 || !window.matchMedia('(min-width: 64rem)').matches) return;
          pointerId = event.pointerId;
          startX = event.clientX;
          startWidth = sidebar.getBoundingClientRect().width;
          resizer.setPointerCapture(pointerId);
          document.body.classList.add('sidebar-resizing');
          event.preventDefault();
        });

        resizer.addEventListener('pointermove', function(event) {
          if (event.pointerId !== pointerId) return;
          setWidth(startWidth + event.clientX - startX, false);
        });

        function finishResize(event) {
          if (event.pointerId !== pointerId) return;
          pointerId = null;
          document.body.classList.remove('sidebar-resizing');
          localStorage.setItem('sidebar-width', String(Math.round(sidebar.getBoundingClientRect().width)));
        }

        resizer.addEventListener('pointerup', finishResize);
        resizer.addEventListener('pointercancel', finishResize);
        resizer.addEventListener('dblclick', function() {
          setWidth(defaultWidth, true);
        });
        resizer.addEventListener('keydown', function(event) {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          const direction = event.key === 'ArrowLeft' ? -1 : 1;
          setWidth(sidebar.getBoundingClientRect().width + direction * 16, true);
          event.preventDefault();
        });
      }

      function initSidebarDisclosure() {
        const drawer = document.getElementById('sidebar-drawer');
        const drawerRoot = drawer.parentElement;
        const sidebar = document.getElementById('sidebar');
        const desktopQuery = window.matchMedia('(min-width: 64rem)');
        const storageKey = 'sidebar-collapsed';
        const toggleButtons = document.querySelectorAll('[data-sidebar-toggle]');

        function savedDesktopExpanded() {
          return localStorage.getItem(storageKey) !== 'true';
        }

        function syncState() {
          drawerRoot.classList.toggle('drawer-open', desktopQuery.matches);
          const expanded = drawer.checked;
          const collapsedRail = desktopQuery.matches && !expanded;
          const action = desktopQuery.matches
            ? (expanded ? 'Contraer barra lateral' : 'Expandir barra lateral')
            : (expanded ? 'Cerrar barra lateral' : 'Abrir barra lateral');

          toggleButtons.forEach(function(button) {
            button.setAttribute('aria-expanded', String(expanded));
            button.setAttribute('aria-label', action);
            button.setAttribute('title', action);
          });

          document.querySelectorAll('[data-sidebar-tip]').forEach(function(item) {
            item.classList.toggle('tooltip', collapsedRail);
            item.classList.toggle('tooltip-right', collapsedRail);
          });
        }

        function setExpanded(expanded, persist) {
          drawer.checked = expanded;
          if (persist && desktopQuery.matches) {
            localStorage.setItem(storageKey, String(!expanded));
          }
          syncState();
        }

        toggleButtons.forEach(function(button) {
          button.addEventListener('click', function() {
            setExpanded(!drawer.checked, desktopQuery.matches);
          });
        });

        document.querySelectorAll('[data-sidebar-expand]').forEach(function(button) {
          button.addEventListener('click', function() {
            setExpanded(true, true);
            const firstPageControl = document.querySelector('[data-page-folder-key] > summary, .sidebar-page-node a');
            if (firstPageControl) firstPageControl.focus();
          });
        });

        drawer.addEventListener('change', syncState);
        desktopQuery.addEventListener('change', function(event) {
          const focusWasInSidebar = sidebar.contains(document.activeElement);
          setExpanded(event.matches ? savedDesktopExpanded() : false, false);
          if (!event.matches && focusWasInSidebar) {
            const mobileToggle = document.querySelector('[data-sidebar-toggle-mobile]');
            if (mobileToggle) mobileToggle.focus();
          }
        });

        document.addEventListener('keydown', function(event) {
          if (event.key !== 'Escape' || desktopQuery.matches || !drawer.checked) return;
          setExpanded(false, false);
          const mobileToggle = document.querySelector('[data-sidebar-toggle-mobile]');
          if (mobileToggle) mobileToggle.focus();
        });

        setExpanded(desktopQuery.matches ? savedDesktopExpanded() : false, false);
      }

      function closeMobileSidebar() {
        if (window.matchMedia('(min-width: 64rem)').matches) return;
        const drawer = document.getElementById('sidebar-drawer');
        if (!drawer.checked) return;
        drawer.checked = false;
        drawer.dispatchEvent(new Event('change'));
      }

      function initPageTree() {
        const storageKey = 'page-tree-state';
        let savedState = {};
        try {
          const parsedState = JSON.parse(localStorage.getItem(storageKey) || '{}');
          if (parsedState && typeof parsedState === 'object' && !Array.isArray(parsedState)) {
            savedState = parsedState;
          }
        } catch (error) {
          savedState = {};
        }

        const state = {};
        function persistState() {
          localStorage.setItem(storageKey, JSON.stringify(state));
        }

        document.querySelectorAll('[data-page-folder-key]').forEach(function(folder) {
          const key = folder.dataset.pageFolderKey;
          state[key] = savedState[key] === true;
          folder.open = state[key];
          folder.dataset.persistedOpen = String(state[key]);
          folder.addEventListener('toggle', function() {
            const search = document.getElementById('sidebar-page-search');
            if (search && search.value) return;
            state[key] = folder.open;
            folder.dataset.persistedOpen = String(folder.open);
            persistState();
          });
        });
        persistState();
      }

      function normalizeSearch(value) {
        return String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase('es')
          .trim();
      }

      function initSidebarPageSearch() {
        const input = document.getElementById('sidebar-page-search');
        const tree = document.getElementById('sidebar-pages');
        const empty = document.getElementById('sidebar-page-search-empty');
        if (!input || !tree || input.dataset.initialized === 'true') return;
        input.dataset.initialized = 'true';

        function filterNode(node, query, showAll) {
          const ownMatch = showAll || normalizeSearch(node.dataset.search).includes(query);
          const details = node.querySelector(':scope > details');
          const childList = details ? details.querySelector(':scope > ul') : null;
          let childMatch = false;

          if (childList) {
            Array.from(childList.children).forEach(function(child) {
              childMatch = filterNode(child, query, ownMatch) || childMatch;
            });
          }

          const matches = ownMatch || childMatch;
          node.hidden = !matches;
          if (details) {
            if (query && matches) details.open = true;
            if (!query) details.open = details.dataset.persistedOpen === 'true';
          }
          return matches;
        }

        function applyFilter() {
          const query = normalizeSearch(input.value);
          let matches = 0;
          Array.from(tree.children).forEach(function(node) {
            if (filterNode(node, query, false)) matches++;
          });
          empty.classList.toggle('hidden', matches !== 0);
        }

        input.addEventListener('input', applyFilter);
        input.addEventListener('keydown', function(event) {
          if (event.key !== 'Escape' || !input.value) return;
          input.value = '';
          applyFilter();
          event.preventDefault();
        });
      }

      const recentReportsKey = 'recent-reports';

      function loadRecentReports() {
        try {
          const value = JSON.parse(localStorage.getItem(recentReportsKey) || '[]');
          return Array.isArray(value) ? value : [];
        } catch (error) {
          return [];
        }
      }

      function rememberReport(link) {
        if (!link || !link.href) return;
        const url = new URL(link.href, window.location.href);
        let path = link.dataset.reportPath || '';
        if (!path && link.closest('#sidebar-pages')) {
          const parts = [];
          let folder = link.closest('details');
          while (folder) {
            const summary = folder.querySelector(':scope > summary');
            if (summary) parts.unshift(summary.textContent.trim());
            folder = folder.parentElement.closest('details');
          }
          path = parts.join(' › ');
        }
        const item = {
          href: url.pathname + url.search,
          title: link.dataset.reportTitle || link.textContent.trim(),
          path: path,
          description: link.dataset.reportDescription || '',
          visitedAt: Date.now()
        };
        const recent = loadRecentReports().filter(function(candidate) {
          return candidate && candidate.href !== item.href;
        });
        recent.unshift(item);
        localStorage.setItem(recentReportsKey, JSON.stringify(recent.slice(0, 6)));
      }

      function renderRecentReports() {
        const list = document.getElementById('dashboard-recent-list');
        const empty = document.getElementById('dashboard-recent-empty');
        const clear = document.getElementById('dashboard-clear-recents');
        if (!list || !empty || !clear) return;

        const recent = loadRecentReports();
        list.replaceChildren();
        empty.classList.toggle('hidden', recent.length !== 0);
        clear.classList.toggle('hidden', recent.length === 0);

        recent.forEach(function(item) {
          if (!item || !item.href || !item.title) return;
          const link = document.createElement('a');
          link.href = item.href;
          link.className = 'group rounded-box border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-primary/40 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary';
          link.setAttribute('hx-get', item.href);
          link.setAttribute('hx-target', '#main-content');
          link.setAttribute('hx-swap', 'innerHTML');
          link.setAttribute('hx-push-url', 'true');
          link.dataset.reportLink = '';
          link.dataset.reportTitle = item.title;
          link.dataset.reportPath = item.path || '';
          link.dataset.reportDescription = item.description || '';

          const title = document.createElement('span');
          title.className = 'block font-semibold group-hover:text-primary';
          title.textContent = item.title;
          const path = document.createElement('span');
          path.className = 'mt-1 block truncate text-xs opacity-55';
          path.textContent = item.path || 'Reporte reciente';
          link.append(title, path);
          list.append(link);
        });

        if (window.htmx) window.htmx.process(list);
      }

      function initDashboard() {
        const root = document.getElementById('dashboard-launchpad');
        if (!root || root.dataset.initialized === 'true') return;
        root.dataset.initialized = 'true';

        const input = document.getElementById('dashboard-search');
        const rows = Array.from(document.querySelectorAll('[data-dashboard-report]'));
        const areaButtons = Array.from(document.querySelectorAll('[data-dashboard-area]'));
        const count = document.getElementById('dashboard-result-count');
        const list = document.getElementById('dashboard-report-list');
        const noResults = document.getElementById('dashboard-no-results');
        const reset = document.getElementById('dashboard-reset-filter');
        const showAllButton = document.getElementById('dashboard-show-all');
        let activeArea = '';
        let showAll = false;
        const initialLimit = 12;

        function applyFilter() {
          const query = normalizeSearch(input.value);
          const isFiltered = Boolean(activeArea || query);
          let matches = 0;
          rows.forEach(function(row) {
            const matchesArea = !activeArea || row.dataset.reportArea === activeArea;
            const matchesQuery = !query || normalizeSearch(row.dataset.search).includes(query);
            const matchesFilter = matchesArea && matchesQuery;
            row.hidden = !matchesFilter || (!isFiltered && !showAll && matches >= initialLimit);
            if (matchesFilter) matches++;
          });

          count.textContent = matches === 1 ? '1 reporte disponible' : matches + ' reportes disponibles';
          list.classList.toggle('hidden', matches === 0);
          noResults.classList.toggle('hidden', matches !== 0);
          reset.classList.toggle('hidden', !isFiltered);
          const remaining = Math.max(0, matches - initialLimit);
          showAllButton.classList.toggle('hidden', isFiltered || showAll || remaining === 0);
          showAllButton.textContent = remaining === 1 ? 'Mostrar 1 reporte más' : 'Mostrar ' + remaining + ' reportes más';
          areaButtons.forEach(function(button) {
            const selected = button.dataset.areaName === activeArea;
            button.setAttribute('aria-pressed', String(selected));
            button.classList.toggle('ring-2', selected);
            button.classList.toggle('ring-primary', selected);
          });
        }

        input.addEventListener('input', function() {
          activeArea = '';
          applyFilter();
        });
        input.addEventListener('keydown', function(event) {
          if (event.key !== 'Escape' || !input.value) return;
          input.value = '';
          applyFilter();
          event.preventDefault();
        });
        areaButtons.forEach(function(button) {
          button.addEventListener('click', function() {
            activeArea = activeArea === button.dataset.areaName ? '' : button.dataset.areaName;
            input.value = '';
            applyFilter();
            document.getElementById('dashboard-all-reports').scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
        reset.addEventListener('click', function() {
          activeArea = '';
          input.value = '';
          showAll = false;
          applyFilter();
          input.focus();
        });
        showAllButton.addEventListener('click', function() {
          showAll = true;
          applyFilter();
        });
        document.getElementById('dashboard-clear-recents').addEventListener('click', function() {
          localStorage.removeItem(recentReportsKey);
          renderRecentReports();
        });

        renderRecentReports();
        applyFilter();
      }

      function syncActiveNavigation() {
        document.querySelectorAll('[data-analyst-nav]').forEach(function(link) {
          const url = new URL(link.href, window.location.href);
          const active = url.pathname === window.location.pathname;
          link.classList.toggle('active', active);
          if (active) {
            link.setAttribute('aria-current', 'page');
            let ancestor = link.closest('details');
            while (ancestor) {
              ancestor.open = true;
              ancestor = ancestor.parentElement.closest('details');
            }
          } else {
            link.removeAttribute('aria-current');
          }
        });
        const currentReport = document.querySelector('#sidebar-pages [data-report-link][aria-current="page"]');
        if (currentReport) rememberReport(currentReport);
      }

      document.addEventListener('DOMContentLoaded', function() {
        setTheme(localStorage.getItem('theme') || 'cmyk');
        initSidebarDisclosure();
        initSidebarResize();
        initPageTree();
        initSidebarPageSearch();
        syncActiveNavigation();
        initDashboard();

        document.addEventListener('click', function(event) {
          const link = event.target.closest ? event.target.closest('[data-report-link]') : null;
          if (link) rememberReport(link);
        });
        document.addEventListener('keydown', function(event) {
          if (event.key !== '/' || event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.target.matches('input, textarea, select, [contenteditable="true"]')) return;
          const search = document.getElementById('dashboard-search') || document.getElementById('sidebar-page-search');
          if (!search) return;
          search.focus();
          event.preventDefault();
        });
      });

      document.addEventListener('htmx:afterSettle', function() {
        syncActiveNavigation();
        closeMobileSidebar();
        initDashboard();
        const mainContent = document.getElementById('main-content');
        const heading = mainContent ? mainContent.querySelector('h1') : null;
        if (heading) {
          heading.setAttribute('tabindex', '-1');
          heading.focus({ preventScroll: true });
        }
      });

      document.addEventListener('htmx:historyRestore', function() {
        syncActiveNavigation();
        const root = document.getElementById('dashboard-launchpad');
        if (root) delete root.dataset.initialized;
        initDashboard();
      });

      (function() {
        const guardedRegions = '#main-content, #sidebar-nav';
        let pending = 0;

        function syncBusyState() {
          const busy = pending > 0;
          document.body.classList.toggle('htmx-busy', busy);
          const mainContent = document.getElementById('main-content');
          if (mainContent) mainContent.setAttribute('aria-busy', String(busy));
        }

        function blockNavigationWhileBusy(event) {
          if (pending === 0) return;
          const link = event.target.closest ? event.target.closest('a[href]') : null;
          if (!link || !link.closest(guardedRegions)) return;
          event.preventDefault();
          event.stopPropagation();
        }

        document.addEventListener('click', blockNavigationWhileBusy, true);
        document.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') blockNavigationWhileBusy(event);
        }, true);

        document.addEventListener('htmx:beforeRequest', function() {
          pending++;
          syncBusyState();
        });
        document.addEventListener('htmx:afterRequest', function() {
          pending = Math.max(0, pending - 1);
          syncBusyState();
        });
        window.addEventListener('pageshow', function() {
          pending = 0;
          syncBusyState();
        });
      })();
    </script>
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="drawer">
      <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />
      <script>
        (function() {
          const drawer = document.getElementById('sidebar-drawer');
          const desktop = window.matchMedia('(min-width: 64rem)').matches;
          drawer.parentElement.classList.toggle('drawer-open', desktop);
          drawer.checked = desktop && localStorage.getItem('sidebar-collapsed') !== 'true';
        })();
      </script>
      <div class="drawer-content min-w-0 flex flex-col">
        <div class="navbar bg-base-100 shadow-md lg:hidden">
          <div class="flex-none">
            <button type="button" class="btn btn-square btn-ghost drawer-button" aria-label="Abrir barra lateral" aria-controls="sidebar" aria-expanded="false" data-sidebar-toggle data-sidebar-toggle-mobile>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-6 w-6 stroke-current">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
            </button>
          </div>
          <div class="flex-1">
            <span class="text-xl font-bold">{{app_name}}</span>
          </div>
        </div>

        <main class="min-w-0 flex-1 p-6">
          <div id="main-content" class="w-full min-w-0" hx-boost="true" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true">
            {{{ main_content }}}
          </div>
        </main>
      </div>

      <div class="drawer-side z-10">
        <label for="sidebar-drawer" aria-label="Cerrar barra lateral" class="drawer-overlay"></label>
        <aside id="sidebar" class="relative flex h-full flex-col bg-base-100">
          <div id="sidebar-resizer" role="separator" aria-label="Resize sidebar" aria-orientation="vertical" aria-valuemin="224" aria-valuemax="512" aria-valuenow="256" tabindex="0" class="group absolute inset-y-0 right-0 z-20 w-2 cursor-col-resize touch-none">
            <div class="mx-auto h-full w-0.5 bg-primary opacity-0 transition-opacity group-hover:opacity-50 group-focus:opacity-50"></div>
          </div>
          <div id="sidebar-header" class="flex h-16 items-center justify-between gap-2 border-b border-base-300 px-3">
            <div class="sidebar-expanded-only flex min-w-0 items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8 shrink-0 text-primary">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75h16.5v16.5H3.75V3.75zM8.25 8.25h7.5v7.5h-7.5v-7.5z" />
              </svg>
              <span class="truncate text-xl font-bold">{{app_name}}</span>
            </div>
            <button type="button" class="btn btn-square btn-ghost btn-sm shrink-0" aria-label="Contraer barra lateral" aria-controls="sidebar" aria-expanded="true" data-sidebar-toggle>
              <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="sidebar-collapse-icon h-5 w-5 stroke-current">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M9 3v18"></path>
                <path d="m16 15-3-3 3-3"></path>
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="sidebar-expand-icon h-5 w-5 stroke-current">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M9 3v18"></path>
                <path d="m14 9 3 3-3 3"></path>
              </svg>
            </button>
