<li class="border-b border-base-300 last:border-b-0" data-dashboard-report data-report-area="{{root_name}}" data-search="{{search}}">
  <a href="/peachfuzz/analyst/pages/{{name}}" class="group flex items-center gap-4 px-4 py-4 transition-colors hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-primary sm:px-5" hx-get="/peachfuzz/analyst/pages/{{name}}" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true" data-report-link data-report-title="{{title}}" data-report-path="{{path}}" data-report-description="{{description}}">
    <span class="grid size-10 shrink-0 place-items-center rounded-box bg-base-200 text-base-content/60 transition-colors group-hover:bg-primary/10 group-hover:text-primary">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
      </svg>
    </span>
    <span class="min-w-0 flex-1">
      <span class="flex flex-wrap items-center gap-2">
        <span class="font-semibold group-hover:text-primary">{{title}}</span>
        {{#is_experimental}}<span class="badge badge-warning badge-xs">Experimental</span>{{/is_experimental}}
      </span>
      <span class="mt-1 block truncate text-xs opacity-55">{{path}}</span>
      <span class="mt-1 block text-sm leading-5 opacity-70">{{description}}</span>
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0 opacity-30 transition group-hover:translate-x-0.5 group-hover:text-primary group-hover:opacity-100" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
    </svg>
  </a>
</li>
