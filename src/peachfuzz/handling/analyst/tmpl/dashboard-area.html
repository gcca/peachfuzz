<button type="button" class="card w-full border border-base-300 bg-base-100 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" data-dashboard-area data-area-name="{{name}}" aria-pressed="false">
  <span class="card-body gap-3 p-5">
    <span class="flex items-start justify-between gap-4">
      <span class="grid size-10 shrink-0 place-items-center rounded-box bg-primary/10 text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-19.5 0v4.5A2.25 2.25 0 004.5 19.5h15a2.25 2.25 0 002.25-2.25v-4.5m-19.5 0h19.5M5.625 9.75V5.625c0-.621.504-1.125 1.125-1.125h4.007c.298 0 .585.119.796.33l1.617 1.617c.211.211.498.33.796.33h4.08c.621 0 1.125.504 1.125 1.125V9.75" />
        </svg>
      </span>
      <span class="flex flex-wrap justify-end gap-2">
        {{#is_experimental}}<span class="badge badge-warning badge-sm">No operar</span>{{/is_experimental}}
        <span class="badge badge-ghost badge-sm">{{count}} reportes</span>
      </span>
    </span>
    <span>
      <span class="block font-semibold">{{name}}</span>
      <span class="mt-1 block text-sm leading-5 opacity-65">{{description}}</span>
    </span>
  </span>
</button>
